name: macOS repro

# Temporary workflow to find the cause of the macOS SIGTRAP in llama_decode.
# Delete it when the cause is known.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'llama.cpp version to test. Use b10909 for the last good build.'
        required: true
        default: 'b10919'
      runs:
        description: 'Number of times to repeat each test'
        required: true
        default: '5'
  push:
    branches:
      - macos-metal-repro

jobs:
  repro:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.version && format('["{0}"]', inputs.version) || '["b10909","b10919"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Install yzma command
        run: go install .
      - name: Install llama.cpp binaries
        run: |
          set -e
          yzma install -lib $GITHUB_WORKSPACE/lib -version ${{ matrix.version }} -p metal
      - name: Add llama.cpp libs to path
        run: |
          echo "YZMA_LIB=$GITHUB_WORKSPACE/lib" >> "$GITHUB_ENV"
      - name: Restore test models
        id: cache-models
        uses: actions/cache/restore@v4
        with:
          path: models
          key: ${{ runner.os }}-models-v5
      - name: Download test model
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ./models
          yzma model get -y --show-progress=false -o $GITHUB_WORKSPACE/models -u https://huggingface.co/QuantFactory/SmolLM-135M-GGUF/resolve/main/SmolLM-135M.Q2_K.gguf
      - name: Get the upstream llama.cpp binaries
        run: |
          set -e
          curl -sL -o upstream.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/${{ matrix.version }}/llama-${{ matrix.version }}-bin-macos-arm64.tar.gz
          mkdir -p upstream
          tar xzf upstream.tar.gz -C upstream
          # Stop now if the binary is absent, so a broken control cannot look like a failure.
          test -n "$(find upstream -type f -name 'llama-completion')" || { echo "llama-completion not found"; exit 1; }
      - name: Repeat the tests
        run: |
          N=${{ inputs.runs || '5' }}
          MODEL=$GITHUB_WORKSPACE/models/SmolLM-135M.Q2_K.gguf
          export YZMA_TEST_MODEL=$MODEL

          # The upstream binary gives a result that does not use the yzma FFI layer.
          UPSTREAM=$(find upstream -type f -name 'llama-completion' | head -1)
          export DYLD_LIBRARY_PATH=$(dirname "$UPSTREAM")

          unit=0
          example=0
          upstream=0

          for i in $(seq 1 $N); do
            echo "::group::run $i of $N"

            if ! go test -run TestGetSampledTokenIth -count=1 ./pkg/llama/; then
              unit=$((unit + 1))
              echo "run $i: unit test failed"
            fi

            if ! go run ./examples/embeddings -model "$MODEL" -p "Hello World"; then
              example=$((example + 1))
              echo "run $i: example failed"
            fi

            if ! "$UPSTREAM" -m "$MODEL" -p "Hello World" -n 16 -no-cnv </dev/null; then
              upstream=$((upstream + 1))
              echo "run $i: upstream binary failed"
            fi

            echo "::endgroup::"
          done

          {
            echo "## llama.cpp ${{ matrix.version }}, $N runs"
            echo ""
            echo "| Test | Failures |"
            echo "| --- | --- |"
            echo "| TestGetSampledTokenIth | $unit / $N |"
            echo "| examples/embeddings | $example / $N |"
            echo "| upstream llama-completion | $upstream / $N |"
          } >> $GITHUB_STEP_SUMMARY

          echo "failures: unit=$unit example=$example upstream=$upstream out of $N"
      - name: Compare the batch paths
        run: |
          N=${{ inputs.runs || '5' }}
          MODEL=$GITHUB_WORKSPACE/models/SmolLM-135M.Q2_K.gguf

          getone=0
          full=0

          for i in $(seq 1 $N); do
            if ! go run ./_repro/batchcompare -mode getone -model "$MODEL"; then
              getone=$((getone + 1))
            fi

            if ! go run ./_repro/batchcompare -mode full -model "$MODEL"; then
              full=$((full + 1))
            fi
          done

          {
            echo "### Batch paths, ${{ matrix.version }}"
            echo ""
            echo "| Batch | Failures |"
            echo "| --- | --- |"
            echo "| BatchGetOne | $getone / $N |"
            echo "| BatchInit and Add | $full / $N |"
          } >> $GITHUB_STEP_SUMMARY

          echo "batch failures: getone=$getone full=$full out of $N"
      - name: Get a backtrace of the trap
        run: |
          MODEL=$GITHUB_WORKSPACE/models/SmolLM-135M.Q2_K.gguf

          go build -o $RUNNER_TEMP/batchcompare ./_repro/batchcompare

          # The trap does not occur on every run, so try until it does.
          for i in $(seq 1 10); do
            echo "attempt $i"
            # -k runs on a crash. In batch mode lldb quits at the stop, so -o
            # commands after run never execute.
            lldb -b -o run -k 'bt all' -k 'image lookup -a $pc' -k 'register read' -- \
              $RUNNER_TEMP/batchcompare -mode full -model "$MODEL" > $RUNNER_TEMP/lldb.log 2>&1 || true

            if grep -q "stop reason" $RUNNER_TEMP/lldb.log; then
              echo "the trap occurred on attempt $i"
              # The Metal compiler writes many warnings, so start at the trap.
              sed -n '/stop reason/,$p' $RUNNER_TEMP/lldb.log | head -200
              exit 0
            fi
          done

          echo "no trap in 10 attempts"
